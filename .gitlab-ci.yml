stages: 
  - stage_build
  - stage_test
  - stage_deploy


variables:
  NAME: Snakow_creator
  CICD_VERSION: v1.0
  LOG_FILE_NAME: log.txt


build_job:
  stage: stage_build
  script:
    - echo "––– Build Started –––"
    - echo "Building..." >> $LOG_FILE_NAME
    - echo "––– Build Completed –––"


test_job:
  stage: stage_test
  script:
    - echo "––– Test Started –––"
    - echo "Testing..." >> $LOG_FILE_NAME
    - echo "––– Test Completed –––"


deploy_to_dev_job:
  stage: stage_deploy
  script:
    - echo "––– Deploy Started –––"
    - echo "Deploy to Dev" >> $LOG_FILE_NAME
    - echo "––– Deploy Completed –––"
    - cat $LOG_FILE_NAME


